[package]
name = "termepub"
version = "2.5.0"
edition = "2021"

[[bin]]
name = "termepub"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
atty = "0.2"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
unicode-segmentation = "1"
unicode-width = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
crossterm = "0.28"
ratatui = "0.29"

[dev-dependencies]
assert_cmd = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
vt100 = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
